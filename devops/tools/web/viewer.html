<!doctype html>
<!--
  REQUIREMENTS: a browser with WebGPU (Chrome/Edge 113+, Safari 18+, Firefox 141+),
                served over HTTP (module scripts do not load from file://).
  DESCRIPTION:  The page a shell-less editor web build runs in
                (`build_web.py --editor --editor-frontend web`). One canvas:
                the scene with picking and the transform gizmo. No panels;
                the host page draws them from the module's exports, which
                this page puts on `window.pill`.
  USAGE:        serve the build directory and open http://localhost:8000/
  EXAMPLE USAGE: python -m http.server 8000 -d devops/tests/projects/native/build/web
  - SCRIPT -
-->
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pill</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        #pill-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #pill-message {
            display: none;
            position: absolute;
            inset: 0;
            margin: auto;
            height: fit-content;
            max-width: 36rem;
            padding: 1rem;
            color: #eee;
            font: 16px/1.5 system-ui, sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>
    <canvas id="pill-canvas"></canvas>
    <p id="pill-message"></p>
    <script type="module">
        function showMessage(text) {
            const message = document.getElementById("pill-message");
            message.textContent = text;
            message.style.display = "block";
        }

        if (!navigator.gpu) {
            showMessage("This editor needs WebGPU, which this browser does not provide.");
        } else {
            import("./pkg/pill_web_app.js")
                .then((module) => module.default().then(() => module))
                .then((module) => {
                    window.pill = module;
                    module.edits_subscribe((json) => console.log("[pill] edit", json));
                })
                .catch((error) => {
                    console.error("loading the editor failed", error);
                    showMessage("The editor failed to load; see the console.");
                });
        }
    </script>
</body>

</html>
