# GAME
TITLE=ekauq3D

# WINDOW
WINDOW_TITLE=Pill Engine - ekauq3D (LibreQuake .map runtime load)
WINDOW_WIDTH=1920
WINDOW_HEIGHT=1080
WINDOW_FULLSCREEN=false

# ENGINE GENERAL
# Largest LibreQuake maps: lq_e2m5 1641 meshes + 912 lights, lqdm5 248 meshes + 2598 lights,
# plus the camera.
MAX_ENTITIES=4608
MAX_CAMERAS=1
# Player sounds: shotgun 3, footsteps 4, jump 2, land 2, axe swing 2, axe hit 2 (2D); ricochets 6
# (3D)
MAX_CONCURRENT_2D_SOUNDS=20
MAX_CONCURRENT_3D_SOUNDS=8

# ENGINE RESOURCES
# lq_e2m5: 563 textures, 177 materials, 1641 meshes. +4 textures for the baked IBL.
MAX_TEXTURES=1024
MAX_MATERIALS=256
MAX_MESHES=2048
MAX_SOUNDS=16

# OTHER
LOG_LEVEL=Info
PANIC_ON_GAME_ERRORS=true
