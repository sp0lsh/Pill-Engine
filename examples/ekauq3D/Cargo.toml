[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "/Users/mk/dev/demo/Pill-Engine/engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `quake_map_loading` pulls the engine's runtime Quake `.map` loader (brushes, textures, lights, sky)
# into this build; the example only fetches the files and spawns the result.
pill_engine = { path = "../../engine/pill_engine", features = ["game", "internal", "quake_map_loading", "ibl_bake", "post_fx", "ui"] }
log = "0.4"
# Session recordings and network messages
serde = { version = "1", features = ["derive"] }
bincode = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response", "RequestMode", "Cache", "CacheStorage", "Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "2"
pollster = "0.2"
# Network play: the engine's renet (UDP) server and client
pill_core = { path = "../../engine/pill_core" }
