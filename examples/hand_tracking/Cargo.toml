[package]
name = "pill_game"
version = "0.1.0"
edition = "2021"
workspace = "NO_PATH"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pill_engine = { path = "../../engine/pill_engine", features = ["game", "ui"] }

# The camera runs only in the web build
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.4", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Navigator",
    "MediaDevices",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStream",
    "MediaStreamConstraints",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "CssStyleDeclaration",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "ImageData",
    "Performance",
    "Request",
    "Response",
] }

# RTen runs the models on the CPU as the tests' reference (it needs rustc 1.94: run the tests with
# rustup's toolchain)
[dev-dependencies]
rten = { version = "0.27", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.27"
png = "0.17"
pollster = "0.2"
